<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' file: data: blob:; connect-src https://api.anthropic.com https://generativelanguage.googleapis.com https://ravisiyer.github.io https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; base-uri 'none'; form-action 'none'; object-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Vedic Verse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+Devanagari:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="frame">
    <!-- atmosphere: single radial ember, per Raycast-style restraint -->
    <div id="atmosphere" aria-hidden="true"></div>
    <canvas id="embers" aria-hidden="true"></canvas>

    <main id="screens">
      <section class="screen" id="screen-home" data-screen="home"></section>
      <section class="screen" id="screen-library" data-screen="library"></section>
      <section class="screen" id="screen-chat" data-screen="chat"></section>
      <section class="screen" id="screen-journal" data-screen="journal"></section>
      <section class="screen" id="screen-profile" data-screen="profile"></section>
    </main>

    <!-- push-navigation layer (chapter index, verse reader) -->
    <div id="pushstack"></div>

    <!-- floating chrome -->
    <nav id="tabbar" class="glass-chrome" aria-label="Primary">
      <button class="tab" data-tab="home" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span>Home</span>
      </button>
      <button class="tab" data-tab="library" aria-label="Library">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>Library</span>
      </button>
      <button class="tab" data-tab="chat" aria-label="Converse">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span>Converse</span>
      </button>
      <button class="tab" data-tab="journal" aria-label="Journal">
        <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span>Journal</span>
      </button>
      <button class="tab" data-tab="profile" aria-label="Profile">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profile</span>
      </button>
    </nav>

    <!-- bottom sheet -->
    <div id="backdrop"></div>
    <div id="sheet" class="glass-chrome" role="dialog" aria-modal="true">
      <div id="sheet-handle"><span></span></div>
      <div id="sheet-content"></div>
    </div>

    <div id="toast" role="status"></div>

    <!-- first-run corpus loading veil -->
    <div id="veil">
      <div class="veil-inner">
        <div class="veil-om">ॐ</div>
        <div class="veil-title">Vedic Verse</div>
        <div class="veil-status" id="veil-status">Preparing the corpus…</div>
        <div class="veil-bar"><span id="veil-bar-fill"></span></div>
        <div class="veil-hint" id="veil-hint"></div>
      </div>
    </div>
  </div>

  <script src="js/corpora.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/art.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
